server:
  port: ${SERVER_PORT:8098}
  shutdown: graceful

spring:
  threads:
    virtual:
      enabled: true
  datasource:
    # stringtype=unspecified: 允许 PG 将 JDBC 字符串参数按目标列类型推断/转换(jsonb 列插入 String 不再报类型不匹配)
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:voyage_db}?stringtype=unspecified
    username: ${DB_USER:root}
    password: ${DB_PASS:root}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5
      idle-timeout: 300000
      connection-timeout: 10000
  flyway:
    enabled: true
    # 应用侧脚本 + SDK 固化脚本（ai-client-sdk 提供的 db/sdk-migration）统一由 Flyway 调度执行
    locations:
      - classpath:db/migration
      - classpath:db/sdk-migration
    baseline-on-migrate: true
    baseline-version: 0
    validate-on-migrate: true
    # SDK 固化脚本版本(V1.0.0_1 => 1.0.0.1)低于应用既有最高版本(V1.4)，
    # 属于外部依赖库补丁式迁移，需允许乱序执行
    out-of-order: true
    encoding: UTF-8
    create-schemas: true
    default-schema: public
    table: flyway_schema_history
  servlet:
    multipart:
      max-file-size: ${FILE_MAX_SIZE:500MB}
      max-request-size: ${FILE_MAX_SIZE:500MB}

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
  global-config:
    db-config:
      id-type: assign_id
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0

# =============================================
# Voyage 自定义配置
# =============================================
app:
  data-root: ${DATA_ROOT:D:/data/voyage}
  # 密码双层加密（内网固定密钥，直接写死，零维护；密钥说明见 docs）
  #   secret-key      : AES-256-GCM 存储层密钥（落库/读出，32 字节）
  #   rsa-private-key : RSA-OAEP 传输层私钥（PKCS#8 Base64，解密前端上行的 dbPass/ftpPass）
  #   rsa-public-key  : RSA-OAEP 传输层公钥（SPKI Base64，经 /api/crypto/public-key 下发给前端）
  crypto:
    secret-key: 3bff438b790c960d62c83381a7d0e826
    rsa-private-key: 
    rsa-public-key: 

# 文件分析（Document Studio）工作区物理根目录：
# 每个工作区在此根下新建一个 UUID 子目录作为隔离沙箱（biz_workspace_sub_dir.abs_path）
workspace:
  root-path: "${app.data-root}/workspace/"

performance:
  template-path: "${app.data-root}/uploads/performance/templates/"
  doc-path: "${app.data-root}/uploads/performance/docs/"

# 数据库性能分析（DB Analysis）：只读探查的行数/超时卡口
db-analysis:
  # 单次只读查询最大返回行数（SDK 默认 100，过小会截断大结果集分析）
  max-rows: ${DB_ANALYSIS_MAX_ROWS:2000}
  # 语句级查询超时（秒），行数放大后相应放宽（SDK 默认 10s）
  query-timeout-seconds: ${DB_ANALYSIS_QUERY_TIMEOUT_SECONDS:30}
  # 单轮对话最大执行步数（每步 = 一次推理 + 可选工具调用），过小会截断复杂任务
  max-steps: ${DB_ANALYSIS_MAX_STEPS:50}

# 文件分析（Document Studio）：ReAct 智能体单轮对话卡口
file-analysis:
  # 单轮对话最大执行步数（每步 = 一次推理 + 可选工具调用），过小会截断复杂任务
  max-steps: ${FILE_ANALYSIS_MAX_STEPS:50}

meta:
  max-file-lines: 2000
  storage:
    preview: "${app.data-root}/meta/preview/"
    formal: "${app.data-root}/meta/formal/"
  template-path: "${app.data-root}/meta/templates/"
  ref-file-path: "${app.data-root}/meta/ref-files/"

# =============================================
# AI 大模型配置（ai-client-sdk 自动装配）
# =============================================
ai:
  sdk:
    # API 端点 Base URL（OpenAI 兼容，SDK 自动追加 /chat/completions）
    # 内网部署：通过环境变量 AI_BASE_URL 注入内网 LLM 网关地址（如 http://192.168.x.x:xxxx/v1）
    base-url: ${AI_BASE_URL:https://api.deepseek.com/v1}
    api-keys:
      - ${AI_API_KEY:sk-b4ed11111111111}
    model: ${AI_MODEL:deepseek-v4-pro}
    timeout: 120s
    max-retries: 3
  # LLM 调用上下文持久化（Trace 自动落盘 sys_llm_invoke_log）
  # 建表 SQL 由 ai-client-sdk 固化于 classpath:db/sdk-migration，已加入 spring.flyway.locations 统一调度
  # auto-ddl 保持 false：不启用 SDK 兜底建表，避免与 Flyway 双建表冲突
  client:
    trace:
      enabled: ${AI_TRACE_ENABLED:true}
      auto-ddl: false
      max-payload-length: 50000
      async-pool-size: 2

logging:
  level:
    com.voyage: debug
    root: info
