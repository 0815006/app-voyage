server:
  port: ${SERVER_PORT:8098}
  shutdown: graceful

spring:
  threads:
    virtual:
      enabled: true
  datasource:
    # stringtype=unspecified: 允许 PG 将 JDBC 字符串参数按目标列类型推断/转换(jsonb 列插入 String 不再报类型不匹配)
    url: ${DB_URL:jdbc:postgresql://localhost:5432/voyage_db?stringtype=unspecified}
    username: ${DB_USER:root}
    password: ${DB_PASS:root}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5
      idle-timeout: 300000
      connection-timeout: 10000
  flyway:
    enabled: true
    # 应用侧脚本 + SDK 固化脚本（ai-client-sdk 提供的 db/sdk-migration）统一由 Flyway 调度执行
    locations:
      - classpath:db/migration
      - classpath:db/sdk-migration
    baseline-on-migrate: true
    baseline-version: 0
    validate-on-migrate: true
    # SDK 固化脚本版本(V1.0.0_1 => 1.0.0.1)低于应用既有最高版本(V1.4)，
    # 属于外部依赖库补丁式迁移，需允许乱序执行
    out-of-order: true
    encoding: UTF-8
    create-schemas: true
    default-schema: public
    table: flyway_schema_history
  servlet:
    multipart:
      max-file-size: ${FILE_MAX_SIZE:500MB}
      max-request-size: ${FILE_MAX_SIZE:500MB}

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
  global-config:
    db-config:
      id-type: assign_id
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0

# =============================================
# Voyage 自定义配置
# =============================================
app:
  data-root: ${DATA_ROOT:D:/data/voyage}
  # 敏感字段加密（AES-256-GCM）：数据库连接密码等敏感数据落库前加密
  # 生产环境务必通过环境变量 APP_CRYPTO_SECRET_KEY 注入独立密钥，禁止沿用默认值
  crypto:
    secret-key: ${APP_CRYPTO_SECRET_KEY:voyage-2026-dev-secret-key-0123456789ABCD}

performance:
  template-path: "${app.data-root}/uploads/performance/templates/"
  doc-path: "${app.data-root}/uploads/performance/docs/"

meta:
  max-file-lines: 2000
  storage:
    preview: "${app.data-root}/meta/preview/"
    formal: "${app.data-root}/meta/formal/"
  template-path: "${app.data-root}/meta/templates/"
  ref-file-path: "${app.data-root}/meta/ref-files/"

# =============================================
# AI 大模型配置（ai-client-sdk 自动装配）
# =============================================
ai:
  sdk:
    api-keys:
      - ${AI_API_KEY:sk-b4ed658d6bd7484eb514df6cb40e09a3}
    model: ${AI_MODEL:deepseek-v4-pro}
    timeout: 60s
    max-retries: 3
  # LLM 调用上下文持久化（Trace 自动落盘 sys_llm_invoke_log）
  # 建表 SQL 由 ai-client-sdk 固化于 classpath:db/sdk-migration，已加入 spring.flyway.locations 统一调度
  # auto-ddl 保持 false：不启用 SDK 兜底建表，避免与 Flyway 双建表冲突
  client:
    trace:
      enabled: ${AI_TRACE_ENABLED:true}
      auto-ddl: false
      max-payload-length: 50000
      async-pool-size: 2

logging:
  level:
    com.voyage: debug
    root: info
